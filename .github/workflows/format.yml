name: Format Python

on: [ push, pull_request ]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check formatting
        run: |
          pip install black==26.5.1
          black --check --diff ./
